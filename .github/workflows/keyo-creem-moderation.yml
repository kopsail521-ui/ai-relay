name: Redeploy moderation proxy on VPS

# Rebuilds the creem-moderation image from services/creem-moderation-proxy
# and recreates the container on the VPS whenever the proxy source changes.
# Requires the same repo variable/secret as the console/static deploys:
#   vars.KEYO_VPS_HOST (+ optional vars.KEYO_VPS_USER)
#   secrets.KEYO_VPS_SSH_KEY

on:
  push:
    branches: [main]
    paths:
      - "services/creem-moderation-proxy/**"
      - ".github/workflows/keyo-creem-moderation.yml"
      - "scripts/vps-redeploy-creem-moderation.sh"
  workflow_dispatch:

concurrency:
  group: keyo-creem-moderation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Redeploy proxy on VPS
    if: vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    # Serialize VPS access across the console/static/blog/proxy deploy jobs:
    # all of them run git operations on /opt/ai-relay and must not overlap.
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
    steps:
      - name: Pull and redeploy over SSH
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ]; then
            echo "KEYO_VPS_HOST is empty; skip deploy"
            exit 0
          fi
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then
            echo "::error::KEYO_VPS_HOST is set but secrets.KEYO_VPS_SSH_KEY is empty. Create the repository secret at Settings > Secrets and variables > Actions > Secrets (name exactly KEYO_VPS_SSH_KEY)."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" "sudo -n true && sudo RELOAD_CADDY=0 bash /opt/ai-relay/scripts/vps-safe-pull-preserve-blog.sh && sudo bash /opt/ai-relay/scripts/vps-redeploy-creem-moderation.sh"
