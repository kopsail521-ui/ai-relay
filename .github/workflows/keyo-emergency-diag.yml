name: Emergency VPS diagnostics

# Read-only emergency diagnostics when the public site is unreachable.
# Collects container/Caddy/disk/memory state and sanitized log tails.
on:
  push:
    branches: [main]
    paths:
      - "scripts/vps-emergency-diag.sh"
      - ".github/workflows/keyo-emergency-diag.yml"
  workflow_dispatch:

concurrency:
  group: keyo-emergency-diag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diag:
    name: Collect VPS diagnostics
    runs-on: ubuntu-latest
    if: vars.KEYO_VPS_HOST != ''
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
    steps:
      - name: Run diagnostics over SSH
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then
            echo "::error::KEYO_VPS_SSH_KEY is empty."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=25 \
            "${USER}@${HOST}" "sudo -n true && sudo bash /opt/ai-relay/scripts/vps-emergency-diag.sh"