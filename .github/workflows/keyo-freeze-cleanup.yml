name: Freeze remediation disk cleanup

# Reclaims disk before it fills up again: prunes unused docker images/build
# cache, vacuums journald, writes log-rotation config. No container restart.
on:
  push:
    branches: [main]
    paths:
      - "scripts/vps-freeze-cleanup.sh"
      - ".github/workflows/keyo-freeze-cleanup.yml"
  workflow_dispatch:

concurrency:
  group: keyo-freeze-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Run freeze cleanup on VPS
    if: vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
    steps:
      - name: Cleanup over SSH
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then echo "::error::KEYO_VPS_SSH_KEY is empty."; exit 1; fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" "sudo -n true && sudo RELOAD_CADDY=0 bash /opt/ai-relay/scripts/vps-safe-pull-preserve-blog.sh && sudo bash /opt/ai-relay/scripts/vps-freeze-cleanup.sh"

