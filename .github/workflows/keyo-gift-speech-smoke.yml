name: Smoke test speech gift twins

# Real-call smoke test for the voice gift-credit twins
# (SenseVoiceSmall:free / GLM-ASR:free / Spark-TTS-0.5B:free).
# Creates a throwaway user+token in the new-api SQLite DB, runs three real
# calls against the public endpoint, asserts success + gift-credit billing,
# then cleans up the token/user.
#
# The remote pipeline lives in scripts/vps-run-gift-speech-smoke.sh and is
# streamed via `ssh 'sudo bash -s' < script` — no nested-quote escaping.
# The real-call smoke job is manual-only (workflow_dispatch with
# run_real_models=true); pushes only run the offline contract tests.
# Requires the same repo variable/secret as the other VPS jobs:
#   vars.KEYO_VPS_HOST (+ optional vars.KEYO_VPS_USER)
#   secrets.KEYO_VPS_SSH_KEY

on:
  push:
    branches: [main]
    paths:
      - "scripts/vps-smoke-gift-speech.py"
      - "scripts/vps-run-gift-speech-smoke.sh"
      - "scripts/test-gitee-passthrough-unit.mjs"
      - "services/gitee-passthrough/**"
      - ".github/workflows/keyo-gift-speech-smoke.yml"
  workflow_dispatch:
    inputs:
      run_real_models:
        description: 'Explicitly authorize real voice generation and temporary production test-account writes'
        type: boolean
        required: true
        default: false

concurrency:
  group: keyo-gift-speech-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  offline:
    name: Offline speech contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node scripts/test-gitee-passthrough-unit.mjs

  smoke:
    name: Smoke speech gift twins
    needs: offline
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_models && vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    # Serialize VPS access across the console/static/blog/speech jobs.
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run smoke test over SSH
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ]; then
            echo "KEYO_VPS_HOST is empty; skip smoke"
            exit 0
          fi
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then
            echo "::error::KEYO_VPS_HOST is set but secrets.KEYO_VPS_SSH_KEY is empty."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" 'sudo -n true && sudo bash -s' \
            < scripts/vps-run-gift-speech-smoke.sh
