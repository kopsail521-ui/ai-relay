name: Inspect dedicated media port owner read only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyo-gitee-owner-diagnostics
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    if: vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: python3 scripts/test-vps-gitee-owner-diagnostics-offline.py
      - name: Read Docker and process ownership without credentials or model calls
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${USER}" ]; then USER=admin; fi
          test -n "${KEY}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_owner_diag"
          chmod 600 "${HOME}/.ssh/keyo_owner_diag"
          trap 'rm -f "${HOME}/.ssh/keyo_owner_diag"' EXIT
          ssh -T -i "${HOME}/.ssh/keyo_owner_diag" -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" \
            'sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -' \
            < scripts/vps-gitee-owner-diagnostics.py
