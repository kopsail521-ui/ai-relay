name: Reorganize gpt-image-2.5 family

# Keeps only gpt-image-2.5-flare and gpt-image-2.5-sunburst, each served by
# the zex (GPT-Image-HD) and aicopy (GPT-Image-Pro) channels; delists
# gpt-image-2.5 and both -vip SKUs everywhere. DB-backed-up and idempotent.
on:
  push:
    branches: [main]
    paths:
      - "scripts/reorg-gpt-image-25.py"
      - "scripts/vps-reorg-gpt-image-25.sh"
      - ".github/workflows/keyo-gpt25-reorg.yml"
  workflow_dispatch:

concurrency:
  group: keyo-gpt25-reorg
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reorg:
    name: Reorganize 2.5 channels on VPS
    if: vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
    steps:
      - name: Run reorg over SSH
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ]; then
            echo "KEYO_VPS_HOST is empty; skip"
            exit 0
          fi
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then
            echo "::error::KEYO_VPS_HOST is set but secrets.KEYO_VPS_SSH_KEY is empty."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" "sudo -n true && sudo RELOAD_CADDY=0 bash /opt/ai-relay/scripts/vps-safe-pull-preserve-blog.sh && sudo bash /opt/ai-relay/scripts/vps-reorg-gpt-image-25.sh"
