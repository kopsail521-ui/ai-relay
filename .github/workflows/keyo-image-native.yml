name: Deploy native media gateway safely

on:
  push:
    branches: [main]
    paths:
      - 'services/apimart-passthrough/image-*.mjs'
      - 'services/apimart-passthrough/server.mjs'
      - 'services/apimart-passthrough/request-budget.mjs'
      - 'services/apimart-passthrough/video-contracts.mjs'
      - 'services/apimart-passthrough/task-responses.mjs'
      - 'services/apimart-passthrough/catalog.json'
      - 'services/apimart-passthrough/Dockerfile'
      - 'services/apimart-passthrough/video-*.test.mjs'
      - 'scripts/test-video-contracts-offline.mjs'
      - 'scripts/test-task-responses-offline.mjs'
      - 'scripts/vps-deploy-native-images-safe.py'
      - 'scripts/test-vps-native-images-safe.py'
      - 'scripts/vps-deploy-images.py'
      - 'scripts/test-vps-deploy-images-offline.py'
      - 'scripts/test-image-gateway-integration.mjs'
      - '.github/workflows/keyo-image-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyo-image-native
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      # The runtime helper is reused; the unrelated clipboard packager is not.
      - run: python3 scripts/test-vps-deploy-images-offline.py DeploymentTests
      - run: python3 scripts/test-vps-native-images-safe.py
      - run: node --test services/apimart-passthrough/image-*.test.mjs
      - run: node scripts/test-image-gateway-integration.mjs
      - run: node scripts/test-video-contracts-offline.mjs
      - run: node scripts/test-task-responses-offline.mjs
      - run: node --test services/apimart-passthrough/video-*.test.mjs
      - run: node scripts/test-auth-page-proxy-offline.mjs

  deploy:
    needs: verify
    if: vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Preserve runtime configuration and deploy native media only
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then
            echo "::error::Existing VPS SSH credential is unavailable."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_native_release"
          chmod 600 "${HOME}/.ssh/keyo_native_release"
          trap 'rm -f "${HOME}/.ssh/keyo_native_release"' EXIT
          ssh -T -i "${HOME}/.ssh/keyo_native_release" -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" \
            'sudo -n true && sudo -n env RELOAD_CADDY=0 bash /opt/ai-relay/scripts/vps-safe-pull-preserve-blog.sh && sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 /opt/ai-relay/scripts/vps-deploy-native-images-safe.py native'
      - name: Verify public image metadata with a GET request only
        run: |
          node --input-type=module <<'NODE'
          const models = ['gpt-image-2', 'gpt-image-2.5-sunburst', 'gpt-image-2.5-flare'];
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch('https://www.keyoapi.xyz/api/pricing', {
                headers: {'Cache-Control': 'no-cache'}, signal: AbortSignal.timeout(15000),
              });
              if (!response.ok) throw new Error('Public image metadata HTTP check failed');
              const payload = await response.json();
              if (!Array.isArray(payload.data)) throw new Error('Public image metadata shape check failed');
              for (const model of models) {
                const row = payload.data.find(item => item.model_name === model);
                if (row?.contract_status !== 'documented' ||
                    !row.supported_endpoint_types?.includes('image-generation:/v1/images/generations')) {
                  throw new Error('Required public image contract missing: ' + model);
                }
              }
              console.log(JSON.stringify({result: 'PUBLIC_NATIVE_IMAGE_METADATA_OK', models, model_calls: 0}));
              break;
            } catch (error) {
              if (attempt === 2) throw error;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }
          NODE
