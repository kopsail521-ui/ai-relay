name: Fix MiniMax-M3.1-Flash model tags

# Sets MiniMax-M3.1-Flash tags to exactly 大语言模型 (the model had invented
# 工具/识图 tags). DB-backed-up, idempotent, tags-only.
on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-minimax-m31-tags.py"
      - "scripts/vps-fix-minimax-m31-tags.sh"
      - ".github/workflows/keyo-minimax-tags-fix.yml"
  workflow_dispatch:

concurrency:
  group: keyo-minimax-tags-fix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    name: Fix tags on VPS
    if: vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
    steps:
      - name: Run tag fix over SSH
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then echo "::error::KEYO_VPS_SSH_KEY is empty."; exit 1; fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" "sudo -n true && sudo RELOAD_CADDY=0 bash /opt/ai-relay/scripts/vps-safe-pull-preserve-blog.sh && sudo bash /opt/ai-relay/scripts/vps-fix-minimax-m31-tags.sh"
