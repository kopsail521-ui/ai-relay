name: Publish Keyo console image

# Builds new-api on GitHub runners (the VPS has 1GB RAM and must not compile).
# Pushes ghcr.io/<owner>/keyo-new-api:main
# Optional auto-deploy: set repository variable KEYO_VPS_HOST and
# KEYO_VPS_USER (default admin), plus secret KEYO_VPS_SSH_KEY.

on:
  push:
    branches: [main]
    paths:
      - "new-api/**"
      - ".github/workflows/keyo-new-api.yml"
      - "scripts/vps-pull-keyo-console.sh"
      - "scripts/vps-recreate-new-api-container.sh"
  workflow_dispatch:

concurrency:
  group: keyo-new-api
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/keyo-new-api
          tags: |
            type=raw,value=main
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: new-api
          file: new-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/keyo-new-api" \
            -f visibility=public

  deploy:
    name: Update VPS
    needs: build
    if: vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Pull image and recreate container
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/keyo-new-api:main
        run: |
          set -euo pipefail
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then
            echo "KEYO_VPS_SSH_KEY is empty; skip deploy"
            exit 0
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" "sudo -n true && bash -s" <<EOF
          set -euo pipefail
          cd /opt/ai-relay
          sudo git pull --ff-only origin main
          echo "${GH_TOKEN}" | sudo docker login ghcr.io -u "${ACTOR}" --password-stdin
          sudo docker pull "${IMAGE}"
          sudo docker logout ghcr.io || true
          sudo IMAGE="${IMAGE}" bash /opt/ai-relay/scripts/vps-recreate-new-api-container.sh
          echo DONE_CICD_DEPLOY
          EOF
