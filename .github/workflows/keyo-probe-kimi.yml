name: Probe kimi-k3 gateway metrics

on:
  workflow_dispatch:
    inputs:
      run_real_model:
        description: 'Explicitly authorize a real kimi-k3 request and production probe setup'
        type: boolean
        required: true
        default: false

concurrency:
  group: keyo-probe-kimi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Run field probe for kimi-k3
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_model && vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
    steps:
      - name: Run probe over SSH
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ]; then
            echo "KEYO_VPS_HOST is empty; skip probe"
            exit 0
          fi
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then
            echo "::error::KEYO_VPS_HOST is set but secrets.KEYO_VPS_SSH_KEY is empty."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" "sudo -n true && sudo bash -c '
              set -e
              cd /opt/ai-relay
              bash scripts/vps-safe-pull-preserve-blog.sh >/dev/null
              bash scripts/vps-deploy-console.sh
              python3 /opt/ai-relay/scripts/vps-probe-kimi.py /opt/ai-relay/data/new-api/one-api.db /opt/ai-relay/static/brand/probe-kimi-k3.json
              chmod 644 /opt/ai-relay/static/brand/probe-kimi-k3.json || true
            '"
