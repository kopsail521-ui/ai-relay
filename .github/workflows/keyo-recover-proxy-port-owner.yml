name: Recover diagnosed proxy port owner

# One-time recovery, pinned to the two image IDs in the reviewed script.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.KEYO_VPS_HOST != ''
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Recover reviewed container with automatic rollback
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${USER}" ]; then USER=admin; fi
          test -n "${KEY}"
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_recover"
          chmod 600 "${HOME}/.ssh/keyo_recover"
          trap 'rm -f "${HOME}/.ssh/keyo_recover"' EXIT
          ssh -T -i "${HOME}/.ssh/keyo_recover" -o BatchMode=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" \
            'sudo -n true && command -v python3 >/dev/null && sudo -n env PYTHONDONTWRITEBYTECODE=1 python3 -' \
            < scripts/vps-recover-proxy-port-owner.py 2> "${RUNNER_TEMP}/keyo-recover-ssh.stderr" || {
              echo "::error::Proxy recovery did not pass; inspect the safe result above."
              exit 1
            }
