name: Verify release safety offline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/vps-safe-pull-preserve-blog.sh'
      - 'scripts/vps-redeploy-creem-moderation.sh'
      - 'scripts/test-vps-release-offline.py'
      - 'scripts/public-doc-contracts.test.mjs'
      - 'scripts/public-tts-doc-contracts.test.mjs'
      - 'scripts/test-doc-powershell-offline.mjs'
      - 'static/brand/keyo-api-ref*'
      - 'static/brand/keyo-docs.html'
      - 'static/brand/faq.html'
      - '.github/workflows/keyo-release-offline.yml'
  pull_request:
    paths:
      - 'scripts/vps-safe-pull-preserve-blog.sh'
      - 'scripts/vps-redeploy-creem-moderation.sh'
      - 'scripts/test-vps-release-offline.py'
      - 'scripts/public-doc-contracts.test.mjs'
      - 'scripts/public-tts-doc-contracts.test.mjs'
      - 'scripts/test-doc-powershell-offline.mjs'
      - 'static/brand/keyo-api-ref*'
      - 'static/brand/keyo-docs.html'
      - 'static/brand/faq.html'
      - '.github/workflows/keyo-release-offline.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: python3 scripts/test-vps-release-offline.py
      - run: node scripts/test-auth-page-proxy-offline.mjs
      - run: node --test services/creem-moderation-proxy/server.integration.test.mjs
      - run: node --test services/creem-moderation-proxy/request-budget.test.mjs
      - run: python3 scripts/test-vps-stability.py
      - run: node scripts/test-video-contracts-offline.mjs
      - run: node scripts/test-task-responses-offline.mjs
      - run: node --test scripts/public-doc-contracts.test.mjs
      - run: node --test scripts/public-tts-doc-contracts.test.mjs

  windows-docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: node scripts/test-doc-powershell-offline.mjs
