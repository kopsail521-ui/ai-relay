name: Publish static SEO/brand pages

# Static SEO/brand deploy: pull on the VPS and run the same deploy script
# used for manual releases (safe pull + Caddyfile backup + reload).
# Requires the same repo variable/secret as the console and blog deploys:
#   vars.KEYO_VPS_HOST (+ optional vars.KEYO_VPS_USER)
#   secrets.KEYO_VPS_SSH_KEY
# Until those are set this workflow skips silently (guard below).

on:
  push:
    branches: [main]
    paths:
      - "static/seo/**"
      - "static/brand/**"
      - "new-api/web/public/**"
      - "config/seo/**"
      - "scripts/gen-seo-pages.mjs"
      - "scripts/caddy-seo-shared.mjs"
      - "scripts/caddy-seo-handles.caddyfragment"
      - "scripts/caddy-landing-handles.caddyfragment"
      - "scripts/deploy-brand-static.sh"
      - "scripts/patch-spa-shell-noindex.sh"
      - "scripts/vps-static-deploy.sh"
      - "scripts/vps-safe-pull-preserve-blog.sh"
      - ".github/workflows/keyo-static-deploy.yml"
  workflow_dispatch:

concurrency:
  group: keyo-static-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/keyo-release-offline.yml

  deploy:
    name: Deploy static pages on VPS
    needs: verify
    if: vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    # Serialize VPS access across the console/static/blog deploy jobs:
    # all three run git operations on /opt/ai-relay and must not overlap.
    concurrency:
      group: keyo-vps-mutex
      queue: max
      cancel-in-progress: false
    steps:
      # Stream the deploy script from the checkout so the CURRENT version
      # runs even when safe-pull itself is what is broken on the VPS.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Pull and deploy over SSH
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST}" ]; then
            echo "KEYO_VPS_HOST is empty; skip deploy"
            exit 0
          fi
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then
            echo "::error::KEYO_VPS_HOST is set but secrets.KEYO_VPS_SSH_KEY is empty. Create the repository secret at Settings > Secrets and variables > Actions > Secrets (name exactly KEYO_VPS_SSH_KEY)."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" 'sudo -n true && sudo bash -s' \
            < scripts/vps-static-deploy.sh
