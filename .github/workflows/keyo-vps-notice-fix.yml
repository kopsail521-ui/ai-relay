name: Fix notice Acceptable-Use link on VPS

# One-shot ops task: repoints the announcement "Acceptable Use" link from
# /user-agreement to /brand/aup.html inside the New API options table,
# then restarts the container. The fix script itself is idempotent, so
# re-running this workflow is safe.
#
# Triggers automatically once when this workflow file lands on main
# (paths filter below) and stays available via workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keyo-vps-notice-fix.yml"
  workflow_dispatch:

concurrency:
  group: keyo-vps-notice-fix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    name: SSH to VPS and run fix script
    if: vars.KEYO_VPS_HOST != ''
    runs-on: ubuntu-latest
    # Serialize with the other VPS-mutating deploy jobs.
    concurrency:
      group: keyo-vps-mutex
      cancel-in-progress: false
    steps:
      - name: Run vps-fix-notice-links on the VPS
        env:
          HOST: ${{ vars.KEYO_VPS_HOST }}
          USER: ${{ vars.KEYO_VPS_USER }}
          KEY: ${{ secrets.KEYO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${USER}" ]; then USER=admin; fi
          if [ -z "${KEY}" ]; then
            echo "::error::KEYO_VPS_HOST is set but secrets.KEYO_VPS_SSH_KEY is empty."
            exit 1
          fi
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${KEY}" > "${HOME}/.ssh/keyo_vps"
          chmod 600 "${HOME}/.ssh/keyo_vps"
          ssh -i "${HOME}/.ssh/keyo_vps" -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}" "sudo -n true && bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/ai-relay
          sudo git fetch origin
          sudo git checkout origin/main -- scripts/vps-fix-notice-links.py
          sudo python3 scripts/vps-fix-notice-links.py
          sudo docker restart new-api
          echo NOTICE_FIX_SCRIPT_DONE
          EOF

      - name: Verify notice link live
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            body=$(curl -s https://www.keyoapi.xyz/api/notice || true)
            if echo "${body}" | grep -q 'aup.html'; then
              echo "DONE_NOTICE_FIX_VERIFY attempt=${attempt}"
              exit 0
            fi
            echo "attempt ${attempt}: aup.html not in notice yet (container may still be rebooting)"
            sleep 10
          done
          echo "::error::Notice still links Acceptable Use to /user-agreement after fix run"
          exit 1
