<script>
const I18N = {
  en: {

    sub: 'Connect to multiple text, image and speech models through one OpenAI-compatible endpoint. One API key, unified billing and familiar SDKs.',
    ctaStart: 'Get Started',
    ctaDocs: 'Docs',

  },
  zhCN: {

    sub: 'KeyoAPI 提供 OpenAI 兼容的预付费 API 额度：文本对话与文生图（GPT / Claude / Gemini / DeepSeek 等）。统一 API 网关，与模型厂商无隶属关系。注册 → 充值 → 创建 Key → 调用 /v1。',

  },
  zhTW: {

    sub: 'KeyoAPI 提供 OpenAI 相容的預付費 API 額度：文字對話與文生圖。獨立閘道，與模型廠商無隸屬關係。註冊 → 儲值 → 建立 Key → 呼叫 /v1。',
    ctaStart: '開始使用',

    whatLabel: '你會得到',
    whatBody: '對話 + 圖片 API · 錢包預付額度 · /pricing 公開定價 · kopsail521@gmail.com'
  },
  ja: {
    title: 'ひとつのエンドポイントで多モデル',

    ctaStart: 'はじめる',

    ctaPricing: '料金を見る',
    exampleLabel: '例',
    whatLabel: '提供内容',
    whatBody: 'チャット＋画像 API · 前払いクレジット · /pricing · kopsail521@gmail.com'
  },
  fr: {
    title: 'Un endpoint, plusieurs modèles',
    sub: 'KeyoAPI vend des crédits API prépayés compatibles OpenAI (chat & image). Passerelle indépendante. Inscription → recharge → clé → /v1.',
    ctaStart: 'Commencer',
    ctaDocs: 'Docs',

  },
  ru: {

  },
  vi: {

    sub: 'KeyoAPI bán tín dụng API trả trước tương thích OpenAI (chat & ảnh). Cổng độc lập. Đăng ký → nạp tiền → tạo key → gọi /v1.',
    ctaStart: 'Bắt đầu',
    ctaDocs: 'Tài liệu',
    ctaPricing: 'Xem giá',
    exampleLabel: 'Ví dụ',
    whatLabel: 'Bạn nhận được',
    whatBody: 'API chat + ảnh · ví trả trước · /pricing · kopsail521@gmail.com'
  }
};

function normalizeLang(raw) {
  if (!raw) return 'en';
  const v = String(raw).trim().replace(/_/g, '-');
  if (v === 'zhCN' || /^zh(-cn|-hans)?$/i.test(v)) return 'zhCN';
  if (v === 'zhTW' || /^zh-(tw|hk|mo|hant)/i.test(v)) return 'zhTW';
  const short = v.split('-')[0].toLowerCase();
  if (['en', 'ja', 'fr', 'ru', 'vi'].includes(short)) return short;
  return 'en';
}

const LANG_LABELS = {
  en: 'English',
  zhCN: '简体中文',
  zhTW: '繁體中文',
  ja: '日本語',
  fr: 'Français',
  ru: 'Русский',
  vi: 'Tiếng Việt'
};

let current = 'en';
const embedded = window.parent !== window;

function applyLang(raw) {
  const code = normalizeLang(raw);
  current = code;
  const dict = I18N[code] || I18N.en;
  document.documentElement.lang = code === 'zhCN' ? 'zh-CN' : code === 'zhTW' ? 'zh-TW' : code;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (dict[key]) el.textContent = dict[key];
  });
  const sel = document.getElementById('langSelect');
  if (sel && sel.value !== code) sel.value = code;
}

function readStoredLang() {
  try {
    return localStorage.getItem('i18nextLng') || '';
  } catch {
    return '';
  }
}

function readQueryLang() {
  try {
    return new URLSearchParams(location.search).get('lang') || '';
  } catch {
    return '';
  }
}

function signalReady() {
  if (!embedded) return;
  try {
    window.parent.postMessage({ type: 'keyo-brand-ready' }, '*');
  } catch {}
}

const langBar = document.getElementById('langBar');
const langSelect = document.getElementById('langSelect');
if (embedded) langBar.classList.add('embedded');

Object.entries(LANG_LABELS).forEach(([code, label]) => {
  const opt = document.createElement('option');
  opt.value = code;
  opt.textContent = label;
  langSelect.appendChild(opt);
});
langSelect.addEventListener('change', () => {
  applyLang(langSelect.value);
  try { localStorage.setItem('i18nextLng', langSelect.value); } catch {}
});

window.addEventListener('message', (event) => {
  const data = event.data;
  if (!data || typeof data !== 'object') return;
  if (data.lang) applyLang(data.lang);
});

window.addEventListener('storage', (event) => {
  if (event.key === 'i18nextLng') applyLang(event.newValue || 'en');
});

const initialLang = embedded
  ? (readQueryLang() || 'en')
  : (readQueryLang() || readStoredLang() || navigator.language || 'en');
applyLang(initialLang);
signalReady();
if (embedded) {
  let n = 0;
  const retry = setInterval(() => {
    signalReady();
    if (++n >= 8) clearInterval(retry);
  }, 250);
}

setInterval(() => {
  if (embedded) return;
  const lang = readStoredLang();
  if (lang && normalizeLang(lang) !== current) applyLang(lang);
}, 800);
</script>
