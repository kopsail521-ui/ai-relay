<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KeyoAPI Status</title>
<meta name="description" content="KeyoAPI service status — OpenAI-compatible API gateway uptime check." />
<link rel="canonical" href="https://www.keyoapi.xyz/status" />
<link rel="icon" href="/brand/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/brand/keyo-theme.css" />
<style>
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.ok { background:var(--ok); }
  .dot.bad { background:#9b2c2c; }
  .row { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  dl { margin:0; }
  .pair { display:flex; justify-content:space-between; gap:16px; border-top:1px solid var(--line); padding-top:10px; font-size:14px; }
  .pair:first-of-type { border-top:0; padding-top:0; }
  dt { color:var(--muted); }
  dd { margin:0; font-family:var(--mono); font-size:13px; word-break:break-all; }
</style>
</head>
<body>
  <header class="k-nav">
  <a class="k-wordmark" href="/">
    <img src="/brand/logo.svg" alt="" width="22" height="22" />
    KeyoAPI
  </a>
  <nav aria-label="Primary">
    <a href="/pricing">Pricing</a>
    <a href="/brand/keyo-docs.html">Docs</a>
    <a href="/faq">FAQ</a>
    <a href="/sign-in">Sign in</a>
    <a class="k-nav-cta" href="/sign-up">Get started</a>
  </nav>
</header>
  <div class="k-page">
    <h1>Service Status</h1>
    <p class="sub">KeyoAPI — OpenAI-compatible API gateway</p>
    <div class="k-card">
      <div class="row">
        <span class="dot" id="dot"></span>
        <strong id="headline">Checking…</strong>
      </div>
      <dl id="meta"></dl>
    </div>
    <p class="k-foot">
      Support: <a href="mailto:kopsail521@gmail.com">kopsail521@gmail.com</a><br />
      Docs: <a href="/brand/keyo-docs.html">/brand/keyo-docs.html</a> ·
      FAQ: <a href="/faq">/faq</a> ·
      Pricing: <a href="/pricing">/pricing</a>
    </p>
  </div>
<script>
(async function () {
  const dot = document.getElementById("dot");
  const headline = document.getElementById("headline");
  const meta = document.getElementById("meta");
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    if (!r.ok) throw new Error("status " + r.status);
    const j = await r.json();
    const d = j.data || j;
    dot.className = "dot ok";
    headline.textContent = "All systems operational";
    const rows = [
      ["System", d.system_name || "KeyoAPI"],
      ["Version", d.version || "—"],
      ["API endpoint", "https://www.keyoapi.xyz/v1"],
      ["Checked", new Date().toISOString()],
    ];
    meta.innerHTML = rows
      .map(
        ([k, v]) =>
          `<div class="pair"><dt>${k}</dt><dd>${String(v)}</dd></div>`
      )
      .join("");
  } catch (e) {
    dot.className = "dot bad";
    headline.textContent = "Unable to reach API status";
    meta.innerHTML =
      '<div class="pair"><dt>Error</dt><dd>' +
      String(e.message || e) +
      "</dd></div>";
  }
})();
</script>
</body>
</html>
