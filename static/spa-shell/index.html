<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Required for crawlers: auth/console/rankings are SPA shells and must not be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/brand/logo.svg" type="image/svg+xml" />
    <title>KeyoAPI</title>
  </head>
  <body>
    <div id="root" translate="no" class="notranslate" role="status" style="padding:32px;font:16px/1.5 system-ui,sans-serif">Loading KeyoAPI…</div>
    <script>
      (async function bootSpa() {
        // Prefer native HTML parse over DOMParser+re-inject: large moderation injects
        // (~130KB) made script onerror / sync throws show "Loading failed".
        function withNoindex(html) {
          if (/name=["']robots["']/i.test(html)) {
            return html.replace(
              /<meta[^>]*name=["']robots["'][^>]*>/i,
              '<meta name="robots" content="noindex, nofollow" />'
            );
          }
          if (/<head[^>]*>/i.test(html)) {
            return html.replace(
              /<head([^>]*)>/i,
              '<head$1><meta name="robots" content="noindex, nofollow" />'
            );
          }
          return html;
        }
        async function loadRaw() {
          var lastErr = null;
          for (var attempt = 0; attempt < 3; attempt++) {
            var controller = new AbortController();
            var timeout = setTimeout(function () { controller.abort(); }, 10000);
            try {
              var res = await fetch("/__spa_raw", { credentials: "same-origin", cache: "no-store", signal: controller.signal });
              if (!res.ok) throw new Error("spa_raw " + res.status);
              var html = await res.text();
              if (!html || html.length < 500) throw new Error("spa_raw too short");
              return html;
            } catch (e) {
              lastErr = e;
              await new Promise(function (r) { setTimeout(r, 250 * (attempt + 1)); });
            } finally {
              clearTimeout(timeout);
            }
          }
          throw lastErr || new Error("spa_raw failed");
        }
        try {
          var html = withNoindex(await loadRaw());
          document.open();
          document.write(html);
          document.close();
        } catch (e) {
          console.error("spa boot failed", e);
          var el = document.getElementById("root");
          if (el) {
            el.textContent = "KeyoAPI could not load. ";
            var retry = document.createElement("button");
            retry.textContent = "Try again";
            retry.onclick = function () { location.reload(); };
            el.appendChild(retry);
            var home = document.createElement("a");
            home.href = "/";
            home.textContent = " Back to home";
            el.appendChild(home);
          }
        }
      })();
    </script>
  </body>
</html>
